<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<style>
.code-copy-wrapper {
  position: relative;
}

.code-copy-button {
  position: absolute;
  top: 0.35rem;
  right: 0.35rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 0.35rem;
  background: rgba(0, 0, 0, 0.35);
  color: inherit;
  cursor: pointer;
  opacity: 0.85;
}

.code-copy-button:hover {
  opacity: 1;
}

.code-copy-button:focus-visible {
  outline: 2px solid #7aa2ff;
  outline-offset: 1px;
}

.code-copy-button svg {
  width: 1rem;
  height: 1rem;
  fill: currentColor;
}
</style>
<script>
(function () {
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }

    return new Promise(function (resolve, reject) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'absolute';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        // Fallback legado para navegadores sem Clipboard API.
        var successful = document.execCommand('copy');
        document.body.removeChild(textarea);
        successful ? resolve() : reject();
      } catch (err) {
        document.body.removeChild(textarea);
        reject(err);
      }
    });
  }

  function createButton() {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'code-copy-button';
    button.setAttribute('aria-label', 'Copiar código');
    button.title = 'Copiar código';
    button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H6a2 2 0 0 0-2 2v12h2V3h10V1zm3 4H10a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H10V7h9v14z"/></svg>';
    return button;
  }

  function attachCopyButtons() {
    var blocks = document.querySelectorAll('pre > code');

    blocks.forEach(function (code) {
      var pre = code.parentElement;
      if (!pre || pre.dataset.copyReady === 'true') {
        return;
      }

      pre.dataset.copyReady = 'true';
      pre.classList.add('code-copy-wrapper');

      var button = createButton();
      button.addEventListener('click', function () {
        copyText(code.textContent.replace(/\n$/, '')).then(function () {
          button.title = 'Copiado!';
          setTimeout(function () {
            button.title = 'Copiar código';
          }, 1200);
        }).catch(function () {
          button.title = 'Falha ao copiar';
          setTimeout(function () {
            button.title = 'Copiar código';
          }, 1200);
        });
      });

      pre.appendChild(button);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachCopyButtons);
  } else {
    attachCopyButtons();
  }
})();
</script>
